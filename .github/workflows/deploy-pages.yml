name: Construire et publier le site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Vérifier les sources
        run: npm run check
      - name: Construire le site statique
        run: npm run build
      - name: Vérifier l’export et le domaine
        run: |
          test -s dist/index.html
          test -s dist/parcours/index.html
          test -s dist/programme/index.html
          test -s dist/contact/index.html
          test "$(cat dist/CNAME)" = "samuel-oliveira.ch"
      - name: Préparer GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Enregistrer les fichiers à publier
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
